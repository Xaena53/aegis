# Aegis — tek komutla hosted (HTTP) mod:
#   cp .env.example .env   (dört zorunlu değeri doldur — bkz. docs/DOCKER.md)
#   docker compose up --build
#   curl http://localhost:8787/health

services:
  aegis:
    build: .
    image: aegis
    # Sırlar .env'den gelir; .env imaja HİÇBİR ZAMAN kopyalanmaz (bkz. .dockerignore)
    env_file: .env
    environment:
      # Konteynerin İÇ portu sabit 8787: .env'deki PORT değerini bilerek ezer,
      # yoksa aşağıdaki port eşlemesi kırılır. Dış portu değiştirmek istersen
      # ports satırının SOL tarafını değiştir (örn. "127.0.0.1:9000:8787").
      PORT: "8787"
      # Dışarıdan görünen adres — MCP Host/Origin doğrulaması bunu kullanır,
      # eşlenen portla aynı olmalı. .env'de tanımlıysa oradaki değer kazanır.
      AEGIS_PUBLIC_URL: "${AEGIS_PUBLIC_URL:-http://localhost:8787}"
      # Veritabanı kalıcı birimde: içinde şifreli refresh token'lar var. .env'de
      # boş bırakılmış AEGIS_DB'nin salt-okunur /app'e düşmesini de önler.
      AEGIS_DB: /data/aegis.db
      #
      # ── DEMO MODU (jüri/mentör): SIM-Swap SİMÜLASYONU, NaC token'sız ──────
      # Aşağıdaki iki satırın yorumunu kaldır; üretilen her metin açıkça
      # "SİMÜLASYON" ibaresi taşır, gerçek ağ doğrulaması gibi sunulamaz:
      #   temiz   -> SIM değişimi yok sayılır, onay akışı normal ilerler
      #   degisti -> SIM değişmiş sayılır: SERT RET, onay istemi hiç çıkmaz
      # AEGIS_NAC_SIMULATE: "temiz"
      # AEGIS_APPROVER_PHONE: "+905551112233"   # simülasyonda da ZORUNLU
    ports:
      # YALNIZ LOOPBACK'E YAYINLA. Sunucu düz HTTP konuşur; TLS'i önündeki nginx/Caddy
      # sonlandırır. Yayın adresi yazılmazsa Docker 0.0.0.0'a bağlar ve 443'ün YANINDA
      # şifresiz bir 8787 açılır: saldırgan /connect ve /settings'e düz HTTP konuşur,
      # /mcp için doğru Host başlığını göndermesi yeter — API anahtarları ve OAuth
      # kodları açık metin taşınır. Yani ters vekil, atlanabilir bir süs olur.
      # Dışarıya açmak İSTİYORSAN bunu değil, önündeki TLS sonlandırıcıyı aç.
      - "127.0.0.1:8787:8787"
    volumes:
      # Kalıcı birim: kullanıcı token'ları burada yaşar; silinirse tüm
      # kullanıcıların bağlantısı düşer ve herkes yeniden /connect yapar.
      - aegis-verisi:/data
    # TEK replika çalıştır: oturumlar süreç belleğinde (bkz. Dockerfile sonu)
    restart: unless-stopped

volumes:
  aegis-verisi:
